<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<section data-screen-label="Book a workshop" style="font-family:'Satoshi',sans-serif;color:#ece9e0;padding:clamp(32px,6vw,80px) clamp(16px,3vw,40px) 0">
<div style="max-width:820px">

<sc-if value="{{ isForm }}" hint-placeholder-val="{{ true }}">
<div style="font-size:15px;color:#8f8b80">Book a workshop</div>
<h1 style="margin:14px 0 0;font-family:'Clash Display',sans-serif;font-weight:500;font-size:clamp(40px,6vw,88px);letter-spacing:-.04em;line-height:.92;text-wrap:balance">Tell me about the session.</h1>
<p style="margin:18px 0 0;max-width:48ch;font-size:clamp(17px,1.5vw,20px);line-height:1.5;color:#c9c5ba">A few details are enough. I reply within two working days with a suggested format and next steps.</p>

<form onSubmit="{{ submit }}" noValidate="{{ true }}" style="margin-top:clamp(32px,4vw,48px)">
<div style="display:grid;grid-template-columns:{{ cols }};gap:18px 24px">
<sc-for list="{{ fields }}" as="f" hint-placeholder-count="4"><label style="display:block;min-width:0"><span style="font-size:14px;color:#8f8b80">{{ f.label }}</span><input type="{{ f.type }}" name="{{ f.key }}" autoComplete="{{ f.ac }}" value="{{ f.v }}" onChange="{{ f.on }}" placeholder="{{ f.ph }}" aria-invalid="{{ f.bad }}" style="display:block;width:100%;margin-top:6px;background:none;border:0;border-bottom:1px solid {{ f.bd }};outline:none;color:#ece9e0;padding:8px 0;font-family:'Satoshi',sans-serif;font-size:19px" style-focus="border-bottom-color:#ece9e0"></label></sc-for>
</div>

<sc-for list="{{ groups }}" as="g" hint-placeholder-count="2">
<fieldset style="margin:clamp(28px,3.5vw,40px) 0 0;padding:0;border:0;min-width:0">
<legend style="padding:0;font-family:'Clash Display',sans-serif;font-weight:500;font-size:clamp(22px,2.2vw,28px);letter-spacing:-.015em">{{ g.q }}</legend>
<div style="margin-top:4px;font-size:14px;color:#8f8b80">{{ g.sub }}</div>
<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px"><sc-for list="{{ g.opts }}" as="o" hint-placeholder-count="5"><button type="button" onClick="{{ o.pick }}" aria-pressed="{{ o.aria }}" style="white-space:nowrap;background:{{ o.bg }};color:#ece9e0;border:1px solid {{ o.bd }};min-height:44px;padding:0 14px;cursor:pointer;font-size:15px" style-hover="border-color:#ece9e0">{{ o.l }}</button></sc-for></div>
</fieldset>
</sc-for>

<div style="display:grid;grid-template-columns:{{ cols }};gap:18px 24px;margin-top:clamp(28px,3.5vw,40px)">
<sc-for list="{{ selects }}" as="s" hint-placeholder-count="4"><label style="display:block;min-width:0"><span style="font-size:14px;color:#8f8b80">{{ s.label }}</span><select value="{{ s.v }}" onChange="{{ s.on }}" style="display:block;width:100%;margin-top:6px;background:#111110;border:1px solid #34332e;color:#ece9e0;min-height:46px;padding:0 10px;font-family:'Satoshi',sans-serif;font-size:16px;color-scheme:dark"><sc-for list="{{ s.opts }}" as="o" hint-placeholder-count="4"><option value="{{ o.v }}">{{ o.l }}</option></sc-for></select></label></sc-for>
</div>

<label style="display:block;margin-top:clamp(28px,3.5vw,40px)"><span style="font-size:14px;color:#8f8b80">Anything else I should know? A link, a constraint, a date.</span><textarea value="{{ notes }}" onChange="{{ onNotes }}" rows="4" style="display:block;width:100%;margin-top:6px;background:#111110;border:1px solid #34332e;outline:none;color:#ece9e0;padding:12px 14px;font-family:'Satoshi',sans-serif;font-size:17px;line-height:1.45;resize:vertical" style-focus="border-color:#8f8b80"></textarea></label>

<label aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden">Website<input tabIndex="-1" autoComplete="off" value="{{ trap }}" onChange="{{ onTrap }}"></label>

<div style="display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;margin-top:28px">
<button type="submit" disabled="{{ sending }}" style="white-space:nowrap;background:#ff4b23;color:#0b0b0a;border:0;min-height:56px;padding:0 26px;cursor:pointer;font-size:18px;font-weight:500;opacity:{{ sendOp }}" style-hover="background:#ece9e0">{{ sendL }}</button>
<span role="status" aria-live="polite" style="font-size:15px;color:{{ msgC }}">{{ msg }}</span>
</div>
</form>
</sc-if>

<sc-if value="{{ isSent }}" hint-placeholder-val="{{ false }}">
<div style="font-size:15px;color:#ff4b23">Enquiry sent</div>
<h1 style="margin:14px 0 0;font-family:'Clash Display',sans-serif;font-weight:500;font-size:clamp(40px,6vw,88px);letter-spacing:-.04em;line-height:.92;text-wrap:balance">{{ sentTitle }}</h1>
<p style="margin:18px 0 0;max-width:48ch;font-size:clamp(17px,1.5vw,20px);line-height:1.5;color:#c9c5ba">{{ sentCopy }}</p>
<div style="display:flex;flex-wrap:wrap;gap:12px 24px;margin-top:28px;font-size:16px"><a href="#/library">Browse the Library</a><a href="#/builder">Open Builder</a></div>
</sc-if>

</div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  // Options mirror what was asked in the old step-by-step flow, so enquiries stay comparable.
  static HELP = ["Designing the workshop or Sprint", "Facilitating it on the day", "Structuring the problem first", "Research and preparation", "Synthesis and follow-through", "Not sure yet"];
  static TOPICS = ["A difficult decision", "What to build", "Positioning or brand", "Aligning a leadership team", "Making sense of research", "Where AI fits", "Preparing for the future", "Going to market", "Something else"];
  static SELECTS = [
    ["length", "Session length", ["90 minutes", "Half a day", "A full day", "2 to 5 days, a Sprint", "Several sessions", "Not sure yet"]],
    ["people", "Group size", ["2 to 5", "6 to 10", "11 to 20", "20+"]],
    ["when", "When", ["Within 2 to 4 weeks", "Within 1 to 2 months", "This quarter", "Later this year", "No date yet"]],
    ["budget", "Budget (USD)", ["Under $2,500", "$2,500 to $7,500", "$7,500 to $15,000", "$15,000 to $30,000", "$30,000 or more", "Not approved yet", "No budget yet"]]];
  static FIELDS = [["name", "Name", "text", "name", "Your name", true], ["email", "Work email", "email", "email", "name@company.com", true], ["org", "Organisation", "text", "organization", "Company or team"], ["role", "Your role", "text", "organization-title", "e.g. Head of Product"]];

  state = { v: { name: "", email: "", org: "", role: "", length: "", people: "", when: "", budget: "" }, help: [], topics: [], notes: "", trap: "", status: "idle", bad: {}, w: window.innerWidth };
  componentDidMount() { this.onR = () => this.setState({ w: window.innerWidth }); window.addEventListener("resize", this.onR); }
  componentWillUnmount() { window.removeEventListener("resize", this.onR); }
  set(k, val) { this.setState(s => ({ v: Object.assign({}, s.v, { [k]: val }), bad: Object.assign({}, s.bad, { [k]: false }), status: s.status === "error" || s.status === "invalid" ? "idle" : s.status })); }
  toggle(key, x) { this.setState(s => ({ [key]: s[key].includes(x) ? s[key].filter(y => y !== x) : s[key].concat([x]) })); }

  async submit(e) {
    e.preventDefault();
    const S = this.state, v = S.v, bad = {};
    if (!v.name.trim()) bad.name = true;
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email.trim())) bad.email = true;
    if (Object.keys(bad).length) { this.setState({ bad, status: "invalid" }); return; }
    this.setState({ status: "sending" });
    const body = Object.assign({}, v, { help: S.help.join("; "), topics: S.topics.join("; "), notes: S.notes, website: S.trap,
      source: [this.props.sourceType, this.props.sourceTitle].filter(Boolean).join(": ") || "direct", page: location.href });
    try {
      const res = await fetch("/api/enquiry", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      if (res.ok) { this.setState({ status: "sent" }); window.scrollTo(0, 0); return; }
      this.setState({ status: res.status === 503 ? "offline" : "error" });
    } catch (err) { this.setState({ status: "error" }); }
  }

  renderVals() {
    const S = this.state, C = Component, wide = S.w >= 700, first = (S.v.name || "").trim().split(/\s+/)[0];
    const chip = (key, l) => { const on = S[key].includes(l); return { l, aria: on ? "true" : "false", bg: on ? "rgba(255,75,35,.12)" : "transparent", bd: on ? "#ff4b23" : "#34332e", pick: () => this.toggle(key, l) }; };
    const MSG = { idle: ["", "#8f8b80"], sending: ["Sending…", "#8f8b80"], invalid: ["Add your name and a valid email.", "#ff4b23"], error: ["That didn't go through. Please try again.", "#ff4b23"], offline: ["Enquiries aren't connected yet. Please try again later.", "#ff4b23"] }[S.status] || ["", "#8f8b80"];
    return {
      isForm: S.status !== "sent", isSent: S.status === "sent", cols: wide ? "minmax(0,1fr) minmax(0,1fr)" : "minmax(0,1fr)",
      fields: C.FIELDS.map(([key, label, type, ac, ph, req]) => ({ key, label: label + (req ? "" : " (optional)"), type, ac, ph, v: S.v[key], bad: S.bad[key] ? "true" : "false", bd: S.bad[key] ? "#ff4b23" : "#4a4843", on: e => this.set(key, e.target.value) })),
      groups: [{ q: "What do you need help with?", sub: "Pick any that apply.", opts: C.HELP.map(l => chip("help", l)) }, { q: "What is the session about?", sub: "The question the room needs to answer.", opts: C.TOPICS.map(l => chip("topics", l)) }],
      selects: C.SELECTS.map(([key, label, opts]) => ({ label: label + " (optional)", v: S.v[key], on: e => this.set(key, e.target.value), opts: [{ v: "", l: "Choose…" }].concat(opts.map(o => ({ v: o, l: o }))) })),
      notes: S.notes, onNotes: e => this.setState({ notes: e.target.value }), trap: S.trap, onTrap: e => this.setState({ trap: e.target.value }),
      submit: e => this.submit(e), sending: S.status === "sending", sendOp: S.status === "sending" ? ".6" : "1", sendL: S.status === "sending" ? "Sending…" : "Send enquiry", msg: MSG[0], msgC: MSG[1],
      sentTitle: "Thanks" + (first ? ", " + first : "") + ".", sentCopy: "I'll reply to " + (S.v.email.trim() || "your email") + " within two working days with a suggested format and next steps."
    };
  }
}
</script>
</body>
</html>
